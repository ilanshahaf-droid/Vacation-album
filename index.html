<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4532f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אלבום החופשות">
<title>אלבום החופשות שלנו</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ebdd; --paper2:#ece1cf; --card:#fffdf8; --ink:#2b2620; --muted:#7b6f61;
    --line:#e0d3bf; --accent:#b4532f; --accent-soft:#f3dccf; --teal:#2f6b66; --teal-soft:#d9e9e6;
    --tape:rgba(236,208,128,.75); --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.10);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Assistant",system-ui,sans-serif; color:var(--ink); font-size:16px; line-height:1.5;
    background:var(--paper);
    background-image:radial-gradient(rgba(120,90,50,.06) 1px,transparent 1px);
    background-size:18px 18px; min-height:100vh;
  }
  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
  h1,h2,h3{font-family:"Frank Ruhl Libre",serif;margin:0;line-height:1.2}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
    padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:#cdbb9f}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#9e4626}
  .btn.ghost{background:transparent}
  .btn.danger{color:#a3311d}
  .btn.small{padding:6px 11px;font-size:14px}
  .btn:disabled{opacity:.55;cursor:default}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:4px 6px;border-radius:8px;color:var(--muted);font-size:15px;line-height:1}
  .icon-btn:hover{background:var(--paper2);color:var(--ink)}

  /* home */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
  .top h1{font-size:clamp(30px,6vw,44px);font-weight:900;letter-spacing:-.5px}
  .top h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:4px 0 0;font-size:15px}
  .tools{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .tools input{flex:1;min-width:180px}
  .field,.tools input,.tools select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%}
  .tools select{width:auto}
  .field:focus,.tools input:focus,.tools select:focus{outline:2px solid var(--teal-soft);border-color:var(--teal)}
  .year{display:flex;align-items:center;gap:12px;margin:28px 0 14px;font-family:"Frank Ruhl Libre",serif;font-size:22px;font-weight:700;color:var(--teal)}
  .year::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
  @media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:20px 14px}}
  .card{position:relative;display:block;text-decoration:none;background:var(--card);padding:10px 10px 14px;border-radius:4px;
    box-shadow:var(--shadow);transition:transform .2s, box-shadow .2s}
  .card:nth-child(3n+1){transform:rotate(-1.2deg)} .card:nth-child(3n+2){transform:rotate(.8deg)} .card:nth-child(3n){transform:rotate(-.4deg)}
  .card:hover{transform:rotate(0) translateY(-3px);box-shadow:0 2px 4px rgba(60,40,20,.1),0 14px 30px rgba(60,40,20,.16)}
  .card::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);z-index:2;border-radius:2px}
  .ph{aspect-ratio:4/3;border-radius:2px;overflow:hidden;background:linear-gradient(135deg,#d9e9e6,#f3dccf);display:flex;align-items:center;justify-content:center;font-size:40px}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card h3{font-size:19px;margin:10px 2px 2px}
  .meta{color:var(--muted);font-size:14px;margin:0 2px}
  .counts{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 2px 0}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:56px}
  .empty h2{color:var(--ink);font-size:26px;margin:8px 0}

  /* trip page */
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .back{text-decoration:none;font-weight:600;color:var(--teal)}
  .hero{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(135deg,#2f6b66,#b4532f);min-height:240px;display:flex;align-items:flex-end}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,15,10,.78),rgba(20,15,10,.15) 60%,transparent)}
  .hero .ht{position:relative;color:#fff;padding:22px 22px 20px;width:100%}
  .hero h1{font-size:clamp(28px,6vw,46px);font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .hero .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:15px;opacity:.95}
  .hero .facts a{color:#fff}
  .hero .nocover{position:absolute;top:18px;left:22px;font-size:54px;opacity:.5}
  .notes{background:var(--card);border-radius:var(--r);padding:18px 20px;margin-top:18px;box-shadow:var(--shadow);white-space:pre-wrap;
    border-inline-start:4px solid var(--accent)}
  .notes h2{font-size:18px;margin-bottom:6px;color:var(--accent);white-space:normal}
  .secs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  @media (max-width:760px){.secs{grid-template-columns:1fr}}
  .sec{background:var(--card);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
  .sec h2{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .sec h2 .n{font-family:"Assistant",sans-serif;font-size:13px;font-weight:700;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:1px 9px}
  .sec ul{list-style:none;margin:0 0 10px;padding:0}
  .sec li{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .sec li:last-child{border-bottom:none}
  .it b{font-weight:700}
  .it .note{display:block;color:var(--muted);font-size:14px;white-space:pre-wrap}
  .badge{display:inline-block;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;margin-inline-start:6px;vertical-align:2px}
  .stars{color:#d79a2b;font-size:13px;margin-inline-start:6px;letter-spacing:1px}
  .acts{display:flex;gap:2px;flex-shrink:0}
  .acts a{text-decoration:none}
  .nothing{color:var(--muted);font-size:14px;margin:0 0 10px}
  .add{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
  .add .field{padding:8px 10px;font-size:15px}
  .add .f-name{flex:2 1 160px}.add .f-note{flex:3 1 160px}.add .f-url{flex:3 1 200px;text-align:right}.add .f-url:not(:placeholder-shown){text-align:left}.add select.field{flex:0 1 auto;width:auto}
  .add .btn{flex:0 0 auto}
  .photos{margin-top:18px}
  .photos .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .photos .head h2{margin:0}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 16px}
  @media (max-width:520px){.pgrid{grid-template-columns:1fr 1fr;gap:14px 10px}}
  .pol{margin:0;background:#fff;padding:8px 8px 6px;box-shadow:var(--shadow);border-radius:3px;position:relative}
  .pol:nth-child(odd){transform:rotate(-.8deg)} .pol:nth-child(even){transform:rotate(.7deg)}
  .pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:var(--paper2)}
  .pol figcaption{font-family:"Amatic SC",cursive;font-size:22px;text-align:center;min-height:28px;line-height:1.2;padding-top:4px;word-break:break-word}
  .pol .acts{justify-content:center}
  .pol .is-cover{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
  .drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
  .progress{font-size:14px;color:var(--teal);font-weight:600}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(30,22,14,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--card);border-radius:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{font-size:22px;margin-bottom:14px}
  .modal label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
  .modal textarea{min-height:110px;resize:vertical}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .foot{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
  .modal p{margin:0;color:var(--muted)}
  .lb{position:fixed;inset:0;background:rgba(12,10,8,.94);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px}
  .lb .cap{color:#fff;font-family:"Amatic SC",cursive;font-size:28px;margin-top:10px;text-align:center}
  .lb .ctr{color:#aaa;font-size:13px}
  .lb button{position:absolute;background:rgba(255,255,255,.12);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
  .lb .x{top:14px;left:14px}.lb .pv{right:14px;top:50%}.lb .nx{left:14px;top:50%}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:15px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
  .banner{background:#fff4d6;border:1px solid #ecd28c;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
  .loading{text-align:center;color:var(--muted);padding:80px 0}

  .gp-btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 16px 8px 12px;border-radius:999px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff !important;text-decoration:none;
    font-weight:700;font-size:15px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .gp-btn:hover,.gp-btn:active{background:rgba(255,255,255,.28)}
  .gp-btn .gp-ic{font-size:17px;line-height:1}
  .it{min-width:0;flex:1}
  .atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  .att-wrap{position:relative;display:inline-flex}
  .att{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;text-decoration:none;max-width:210px}
  .att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-img img{width:58px;height:58px;object-fit:cover;border-radius:6px;display:block;background:var(--paper2)}
  .att-x{position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer}
  .add .att-pick{flex:1 1 auto;justify-content:center;border-style:dashed;color:var(--teal);font-weight:600}
  /* auth + account */
  .auth{max-width:400px;margin:0 auto;padding:10vh 6px 40px;text-align:center}
  .auth .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 16px;box-shadow:var(--shadow)}
  .auth h1{font-size:34px;font-weight:900}
  .auth .lead{color:var(--muted);margin:6px 0 24px}
  .auth form{display:flex;flex-direction:column;gap:10px;text-align:right}
  .auth .btn{justify-content:center;padding:11px 14px}
  .auth .or{color:var(--muted);font-size:13px;margin:6px 0}
  .auth .link{background:none;border:none;color:var(--teal);font-weight:600;cursor:pointer;padding:4px}
  .auth .err{color:#a3311d;font-size:14px;min-height:20px}
  .auth .ok{color:var(--teal);font-size:14px}
  .acct{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--muted);font-size:13px;margin-bottom:6px}
  .acct button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
  .pol img.wait,.ph img.wait,.hero img.wait{opacity:0}
  img{transition:opacity .25s}
</style>
</head>
<body>
<div class="wrap">
  <div class="loading" id="loadingView">טוען את האלבום…</div>

  <section class="auth" id="authView" hidden>
    <img class="logo" src="icon-192.png" alt="">
    <h1>אלבום החופשות שלנו</h1>
    <p class="lead">כל המקומות, הטעמים והתמונות מהחופשות במקום אחד</p>
    <button class="btn primary" id="aGoogle" type="button">כניסה עם Google</button>
    <div class="or">או עם אימייל וסיסמה</div>
    <form id="aForm">
      <input class="field" id="aEmail" type="email" autocomplete="email" placeholder="אימייל" dir="ltr">
      <input class="field" id="aPass" type="password" autocomplete="current-password" placeholder="סיסמה" dir="ltr">
      <button class="btn" id="aLogin" type="submit">כניסה</button>
      <div style="display:flex;justify-content:space-between">
        <button class="link" id="aSignup" type="button">הרשמה</button>
        <button class="link" id="aForgot" type="button">שכחתי סיסמה</button>
      </div>
      <div class="err" id="aErr"></div><div class="ok" id="aMsg"></div>
    </form>
  </section>

  <div id="appView" hidden>
    <div class="acct"><span id="acctExtra" style="display:flex;gap:8px;align-items:center"></span><span id="acctEmail" dir="ltr"></span><button id="btnLogout" type="button">התנתקות</button></div>
    <div id="app"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
